name: Build custom Bazzite image

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:
  schedule:
    # Rebuild regularly so the image tracks Bazzite stable even without repo changes.
    - cron: '17 4 * * 1'

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: bazzite-n355-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE_NAME: bazzite-n355
      REGISTRY_AUTH_FILE: /tmp/containers-auth.json
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Set image reference and immutable tags
        id: image
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          ref="ghcr.io/${owner}/${IMAGE_NAME}"
          date_tag="$(date -u +%Y-%m-%d)"
          short_sha="${GITHUB_SHA::12}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "date_tag=$date_tag" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Require signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || {
            echo 'Missing GitHub Actions secret SIGNING_SECRET.' >&2
            exit 1
          }

      - name: Log in to GHCR
        run: |
          printf '%s' '${{ github.token }}' | podman login ghcr.io \
            --authfile "$REGISTRY_AUTH_FILE" \
            --username '${{ github.actor }}' --password-stdin

      - name: Build
        run: |
          podman build --pull=newer \
            --tag '${{ steps.image.outputs.ref }}:latest' \
            --label org.opencontainers.image.source='${{ github.server_url }}/${{ github.repository }}' \
            --label org.opencontainers.image.revision='${{ github.sha }}' \
            .
          podman tag '${{ steps.image.outputs.ref }}:latest' '${{ steps.image.outputs.ref }}:${{ steps.image.outputs.date_tag }}'
          podman tag '${{ steps.image.outputs.ref }}:latest' '${{ steps.image.outputs.ref }}:${{ steps.image.outputs.sha_tag }}'

      - name: Push
        run: |
          podman push --authfile "$REGISTRY_AUTH_FILE" --digestfile /tmp/image-digest \
            '${{ steps.image.outputs.ref }}:latest'
          podman push --authfile "$REGISTRY_AUTH_FILE" \
            '${{ steps.image.outputs.ref }}:${{ steps.image.outputs.date_tag }}'
          podman push --authfile "$REGISTRY_AUTH_FILE" \
            '${{ steps.image.outputs.ref }}:${{ steps.image.outputs.sha_tag }}'
          echo "Published tags:"
          echo "  ${{ steps.image.outputs.ref }}:latest"
          echo "  ${{ steps.image.outputs.ref }}:${{ steps.image.outputs.date_tag }}"
          echo "  ${{ steps.image.outputs.ref }}:${{ steps.image.outputs.sha_tag }}"
          echo "Digest: $(cat /tmp/image-digest)"

      - name: Sign image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ''
          DOCKER_CONFIG: /tmp/cosign-docker
        run: |
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' '${{ github.token }}' | cosign login ghcr.io \
            --username '${{ github.actor }}' --password-stdin
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            '${{ steps.image.outputs.ref }}@'"$(cat /tmp/image-digest)"

      - name: Verify signature
        if: ${{ hashFiles('cosign.pub') != '' }}
        env:
          DOCKER_CONFIG: /tmp/cosign-docker
        run: |
          cosign verify --key cosign.pub \
            '${{ steps.image.outputs.ref }}@'"$(cat /tmp/image-digest)"
