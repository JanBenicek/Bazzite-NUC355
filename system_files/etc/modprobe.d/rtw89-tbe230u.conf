# TP-Link Archer TBE230U / RTL8922AU
# Use the image-baked morrownr/rtw89 USB module and keep USB 2 -> USB 3
# switching enabled. Do not use dynamic new_id for 37ad:0105.
options rtw89_usb_git switch_usb_mode=y

# Avoid a future stock rtw89_8922au claiming 37ad:0105 if that ID is added to
# the in-kernel driver before this custom module is retired.
blacklist rtw89_8922au
